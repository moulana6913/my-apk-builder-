
name: MY APK BUILDER

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Dependencies
        run: npm install

      - name: Create Android Project
        run: |
          node --input-type=module -e "import('./webview-project.js').then(m => m.createAndroidProject({projectDir:'android-project',sourceDir:'public',appName:'My APK Builder',packageName:'com.myapkbuilder.generated'}))"

      - name: Build APK
        run: |
          cd android-project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-APK-BUILDER
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          
